<!-- public/netlify-form-detection.html -->
<html>
  <head></head>
  <body>
    <form
      name="contact"
      method="POST"
      action="/netlify-form-detection.html"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contact" />
      <p hidden>
        <label>Do not fill this out if you are human: <input name="bot-field" /></label>
      </p>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="service"><option value="children">Children</option></select>
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
